<!DOCTYPE html>
<html>
<head>
    <windowconf>
        <title>Eggnet</title>
        <size width=800 height=480/>
    </windowconf>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            color: #fff;
        }
        .viewport {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: stretch;
            gap: 10px;
            box-sizing: border-box;
        }
        .main-panel {
            flex: 1 1 calc(67% - 5px);
            width: auto;
            min-width: 0;
            height: 100%;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .chat-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            padding: 8px 12px;
            border-radius: 20px;
            border-bottom-left-radius: 4px !important;
            background: var(--theme-secondary-bg, #111);
            word-break: break-word;
            align-self: flex-start;
        }
        .msg.me {
            align-self: flex-end;
            border-bottom-left-radius: 20px !important;
            border-bottom-right-radius: 4px !important;
            background: var(--theme-bg-accent, #111);
        }
        .msg .sender {
            font-size: 0.75em;
            opacity: 0.7;
            margin-bottom: 2px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .input-merged {
            gap: 0;
        }
        .input-merged input {
            border-radius: 999px 0 0 999px !important;
        }
        .input-merged button {
            border-radius: 0 999px 999px 0 !important;
            padding: 10px 14px;
        }
        .input-merged button .material-symbols-outlined {
            font-size: 20px;
            line-height: 1;
            display: block;
        }
        input {
            flex: 1;
            padding: 10px;
            padding-left: 18px !important;
            border-radius: 999px;
            border: none;
            outline: none;
            background: var(--theme-dark-bg, #111);
            color: #fff;
        }
        button {
            padding: 10px 15px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: var(--theme-dark-bg, #111);
            color: #fff;
        }
        .sidebar {
            flex: 0 1 auto;
            width: auto;
            min-width: 0;
            max-width: 40%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            gap: 10px;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
        }
        .code-box {
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 2px;
        }
        #room-id {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: normal;
            padding: 14px 16px;
            padding-left: 16px !important;
        }
    </style>
</head>
<body>
    <div class="viewport">
        <div class="main-panel">
            <div id="connect-screen" class="input-row input-merged" style="width: 100%; max-width: 480px;">
                <input id="room-id" placeholder="Room Code">
                <button id="connect-btn" aria-label="Connect"><span class="material-symbols-outlined">connect_without_contact</span></button>
            </div>
            <div id="chat-screen" class="chat-view" style="display: none;">
                <div id="messages" class="messages"></div>
                <div class="input-row input-merged">
                    <input id="msg-input" placeholder="Type message...">
                    <button id="send-btn" aria-label="Send"><span class="material-symbols-outlined">send</span></button>
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div>
                <small>Your Code</small>
                <div id="my-code" class="code-box">......</div>
            </div>
        </div>
    </div>
    <script>
        class EggchatClient {
            constructor() {
                this.ws = null;
                this.myCode = null;
                this.currentRoom = null;
                this.getElements();
                this.bindEvents();
                this.init();
            }

            getElements() {
                this.myCodeEl = document.getElementById('my-code');
                this.roomIdInput = document.getElementById('room-id');
                this.connectBtn = document.getElementById('connect-btn');
                this.messagesEl = document.getElementById('messages');
                this.msgInput = document.getElementById('msg-input');
                this.sendBtn = document.getElementById('send-btn');
                this.connectScreen = document.getElementById('connect-screen');
                this.chatScreen = document.getElementById('chat-screen');
            }

            bindEvents() {
                this.connectBtn.onclick = () => this.connectToRoom();
                this.sendBtn.onclick = () => this.send();
                this.msgInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.send();
                });
            }

            async init() {
                const codePath = '/home/user/.eggcode';
                try {
                    if (window.hyla && await hyla.fs.localExists(codePath)) {
                        const saved = (await hyla.fs.getAsTextLocal(codePath)).trim();
                        if (saved) this.myCode = saved;
                    }
                } catch (err) { /* fall through */ }

                if (!this.myCode) {
                    this.myCode = Math.floor(100000 + Math.random() * 900000).toString();
                    try {
                        if (window.hyla) await hyla.fs.writeText(codePath, this.myCode);
                    } catch (err) {
                        console.error(err);
                    }
                }

                this.myCodeEl.textContent = this.myCode;
                const win = window.frameElement ? window.frameElement.closest('.window') : null;
                if (win && window.hyla && hyla.wm) hyla.wm.changeWindowTitle(win, 'Eggnet — ' + this.myCode);

                this.connectWebSocket();
            }

            connectWebSocket() {
                this.ws = new WebSocket('ws://eggchat.breakmine.com');

                this.ws.onopen = () => {
                    console.log('Connected to Eggchat server');
                };

                this.ws.onmessage = (event) => {
                    try {
                        const payload = JSON.parse(event.data);
                        this.handleServerPayload(payload);
                    } catch (err) {
                        console.error('Failed to parse JSON message:', err);
                    }
                };

                this.ws.onclose = () => {
                    if (window.hyla && hyla.app) hyla.app.notify("Eggnet", "Disconnected from server");
                    this.connectScreen.style.display = 'flex';
                    this.chatScreen.style.display = 'none';
                    // Reconnect after 3 seconds
                    setTimeout(() => this.connectWebSocket(), 3000);
                };

                this.ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                };
            }

            connectToRoom() {
                const targetRoom = this.roomIdInput.value.trim() || this.myCode;
                if (!targetRoom || !this.ws || this.ws.readyState !== WebSocket.OPEN) return;

                this.currentRoom = targetRoom;
                
                // Join request
                this.ws.send(JSON.stringify({
                    type: 'join',
                    room: this.currentRoom
                }));

                this.messagesEl.innerHTML = '';
                this.connectScreen.style.display = 'none';
                this.chatScreen.style.display = 'flex';

                if (window.hyla && hyla.app) hyla.app.notify("Eggnet", "Joined room: " + this.currentRoom);
            }

            handleServerPayload(payload) {
                if (payload.type === 'history') {
                    this.messagesEl.innerHTML = '';
                    (payload.messages || []).forEach(msg => {
                        this.addMessage(msg.username, msg.content);
                    });
                } else if (payload.type === 'message') {
                    const msg = payload.data;
                    this.addMessage(msg.username, msg.content);
                    if (msg.username !== this.myCode && window.hyla && hyla.app) {
                        hyla.app.notify("Eggnet", `${msg.username}: ${msg.content}`);
                    }
                } else if (payload.type === 'error') {
                    console.error("Server Error:", payload.message);
                }
            }

            send() {
                const txt = this.msgInput.value.trim();
                if (!txt || !this.ws || this.ws.readyState !== WebSocket.OPEN) return;

                this.ws.send(JSON.stringify({
                    type: 'message',
                    username: this.myCode,
                    content: txt
                }));

                this.msgInput.value = '';
            }

            addMessage(username, txt) {
                const isMe = username === this.myCode;
                const div = document.createElement('div');
                div.className = 'msg' + (isMe ? ' me' : '');

                const senderDiv = document.createElement('div');
                senderDiv.className = 'sender';
                senderDiv.textContent = isMe ? 'You' : username;

                const contentDiv = document.createElement('div');
                contentDiv.textContent = txt;

                div.appendChild(senderDiv);
                div.appendChild(contentDiv);

                this.messagesEl.appendChild(div);
                this.messagesEl.scrollTop = this.messagesEl.scrollHeight;
            }
        }

        new EggchatClient();
    </script>
</body>
</html>
