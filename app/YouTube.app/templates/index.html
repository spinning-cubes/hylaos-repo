<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Viewer</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>YouTube Viewer</h1>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search YouTube or paste URL...">
        <button id="btn-search">Search</button>
      </div>
    </header>

    <main>
      <div id="browse-view" class="view active">
        <h2 id="section-title">Featured Videos</h2>
        <div id="results-grid" class="results-grid">
          <div class="placeholder-msg">Enter a search term or YouTube URL to get started</div>
        </div>
      </div>

      <div id="watch-view" class="view">
        <div class="video-container">
          <video id="player" controls playsinline></video>
        </div>
        <div class="video-info">
          <h2 id="video-title-display">Video Title</h2>
          <div class="controls">
            <label for="res-select">Quality:</label>
            <select id="res-select">
              <option value="">Auto (Best)</option>
            </select>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script>
    const player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'fullscreen'],
      settings: ['captions', 'quality']
    });

    const searchInput        = document.getElementById('search-input');
    const btnSearch          = document.getElementById('btn-search');
    const browseView         = document.getElementById('browse-view');
    const watchView          = document.getElementById('watch-view');
    const resultsGrid        = document.getElementById('results-grid');
    const resSelect          = document.getElementById('res-select');
    const videoTitleDisplay  = document.getElementById('video-title-display');
    const sectionTitle       = document.getElementById('section-title');

    const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' +
      encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180"><rect width="100%" height="100%" fill="#222"/><text x="50%" y="50%" fill="#666" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">No thumbnail</text></svg>');

    function extractVideoId(urlOrId) {
      if (!urlOrId) return null;
      if (/^[a-zA-Z0-9_-]{11}$/.test(urlOrId)) return urlOrId;
      const match = urlOrId.match(/(?:v=|\/([0-9A-Za-z_-]{11})|youtu\.be\/)([0-9A-Za-z_-]{11})/);
      return match ? (match[1] || match[2]) : null;
    }

    function goHome() {
      window.history.pushState({}, '', '/');
      showBrowseView();
    }

    function showBrowseView() {
      if (browseView) browseView.classList.add('active');
      if (watchView) watchView.classList.remove('active');
      player.pause();
    }

    function showWatchView() {
      if (browseView) browseView.classList.remove('active');
      if (watchView) watchView.classList.add('active');
    }

    function setPlaceholder(msg) {
      if (!resultsGrid) return;
      resultsGrid.innerHTML = '';
      const ph = document.createElement('div');
      ph.className = 'placeholder-msg';
      ph.textContent = msg;
      resultsGrid.appendChild(ph);
    }

    function buildVideoCard(v) {
      const card = document.createElement('div');
      card.className = 'video-card';

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumbnail-wrapper';

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = v.title || '';
      if (v.thumbnail) {
        img.src = v.thumbnail;
        img.addEventListener('error', () => { img.src = PLACEHOLDER_IMG; });
      } else {
        img.src = PLACEHOLDER_IMG;
      }
      thumbWrap.appendChild(img);

      if (v.duration) {
        const dur = document.createElement('span');
        dur.className = 'duration-badge';
        dur.textContent = v.duration;
        thumbWrap.appendChild(dur);
      }

      const info = document.createElement('div');
      info.className = 'video-info';

      const titleEl = document.createElement('h4');
      titleEl.className = 'video-card-title';
      titleEl.textContent = v.title || '(untitled)';
      titleEl.setAttribute('title', v.title || '');
      info.appendChild(titleEl);

      if (v.uploader) {
        const ch = document.createElement('span');
        ch.className = 'video-channel';
        ch.textContent = v.uploader;
        info.appendChild(ch);
      }

      card.appendChild(thumbWrap);
      card.appendChild(info);

      card.addEventListener('click', () => loadVideo(v.id));
      return card;
    }

    async function performSearch(query) {
      const q = query.trim();
      if (!q) return;

      // --- THIS IS THE MISSING FIX ---
      // Switch back to the browse view and pause the currently playing video
      showBrowseView();

      if (sectionTitle) sectionTitle.textContent = `Search Results for "${q}"`;
      setPlaceholder('Searching YouTube...');

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const videos = Array.isArray(data) ? data
                     : Array.isArray(data?.videos) ? data.videos
                     : Array.isArray(data?.items) ? data.items
                     : Array.isArray(data?.results) ? data.results
                     : [];

        if (videos.length === 0) {
          setPlaceholder('No videos found.');
          return;
        }

        const frag = document.createDocumentFragment();
        videos.forEach(v => frag.appendChild(buildVideoCard(v)));
        if (resultsGrid) {
          resultsGrid.innerHTML = '';
          resultsGrid.appendChild(frag);
        }
      } catch (err) {
        console.error('Search error:', err);
        setPlaceholder('Error executing search.');
      }
    }

    async function loadVideo(videoId) {
      showWatchView();
      window.history.pushState({}, '', `/watch?v=${encodeURIComponent(videoId)}`);
      if (videoTitleDisplay) videoTitleDisplay.textContent = 'Loading metadata...';

      try {
        const res = await fetch(`/formats?v=${encodeURIComponent(videoId)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data.title && videoTitleDisplay) videoTitleDisplay.textContent = data.title;

        if (Array.isArray(data.formats) && resSelect) {
          resSelect.innerHTML = '<option value="">Auto (Best)</option>';
          data.formats.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.format_id;
            opt.textContent = f.resolution;
            resSelect.appendChild(opt);
          });
        }

        // Safely clear old tracks before adding new ones
        const videoEl = document.getElementById('player');
        if (videoEl) {
          videoEl.querySelectorAll('track').forEach(t => t.remove());

          if (Array.isArray(data.subtitles)) {
            data.subtitles.forEach(sub => {
              const track = document.createElement('track');
              track.kind = 'captions';
              track.label = sub.lang || '';
              track.srclang = sub.lang || '';
              track.src = sub.url;
              videoEl.appendChild(track);
            });
          }
        }

        const formatId = resSelect ? resSelect.value : '';
        player.source = {
          type: 'video',
          sources: [{
            src: `/stream?v=${encodeURIComponent(videoId)}&format_id=${encodeURIComponent(formatId)}`,
            type: 'video/mp4'
          }]
        };
        player.play().catch(() => {});
      } catch (err) {
        console.error('Metadata load error:', err);
        if (videoTitleDisplay) videoTitleDisplay.textContent = 'Failed to load video metadata.';
      }
    }

    function handleSearchAction() {
      const val = searchInput.value.trim();
      if (!val) return;
      const videoId = extractVideoId(val);
      if (videoId) loadVideo(videoId);
      else performSearch(val);
    }

    if (btnSearch) {
      btnSearch.addEventListener('click', handleSearchAction);
    }
    if (searchInput) {
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          handleSearchAction();
        }
      });
    }

    if (resSelect) {
      resSelect.addEventListener('change', () => {
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        if (!videoId) return;
        const formatId = resSelect.value;
        player.source = {
          type: 'video',
          sources: [{
            src: `/stream?v=${encodeURIComponent(videoId)}&format_id=${encodeURIComponent(formatId)}`,
            type: 'video/mp4'
          }]
        };
        player.play().catch(() => {});
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get('v');
      if (videoId && searchInput) {
        searchInput.value = `https://www.youtube.com/watch?v=${videoId}`;
        loadVideo(videoId);
      }
    });
  </script>
</body>
</html>
